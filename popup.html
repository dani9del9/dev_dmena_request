<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="style.css">
<style>
  body { width: 400px; background: var(--bg); font-size: 14.5px; }
  header { display: flex; align-items: center; justify-content: space-between; padding: 12px; border-bottom: 1px solid var(--border); background: var(--panel); }
  header .brand { display: flex; align-items: center; gap: 8px; }
  header img { width: 24px; height: 24px; }
  main { padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
  .rule { display: flex; align-items: center; gap: 10px; padding: 8px 10px; background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); cursor: pointer; }
  .rule:hover { border-color: var(--accent); }
  .rule .info { flex: 1; min-width: 0; }
  .rule .name { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rule .sub { color: var(--muted); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rule { border-left: 5px solid var(--kind, var(--k-none)); }
  .rule:hover { border-color: var(--kind); border-left-width: 5px; }
  .rule.match { background: var(--kind-soft); }
  .hits { display: inline-block; margin-left: 6px; background: var(--kind, var(--accent)); color: #fff; font-size: 11.5px; font-weight: 700; padding: 1px 6px; border-radius: 9px; vertical-align: 1px; }
  .hidden-note { width: 100%; text-align: left; background: transparent; border: 1px dashed var(--border); color: var(--muted); font-size: 13px; padding: 6px 10px; }
  .hidden-note:hover { border-color: var(--accent); color: var(--accent-dark); }
  .rel-mark { color: var(--accent-dark); font-weight: 700; }
  .page-summary { font-size: 13.5px; color: var(--muted); padding: 6px 10px; border-radius: var(--radius); background: var(--panel2); }
  .page-summary.active { color: var(--accent-dark); background: var(--accent-soft); font-weight: 600; }
  .page-summary.off { color: var(--muted); font-style: italic; }
  .empty { text-align: center; color: var(--muted); padding: 18px 0; }
  footer { display: flex; flex-direction: column; gap: 8px; padding: 10px 12px; border-top: 1px solid var(--border); }
  footer .frow { display: flex; gap: 8px; }
  footer button { flex: 1; }
  .io button { background: #fff; font-size: 13.5px; }
  .import-ask { background: var(--panel); border: 1px solid var(--accent); border-radius: var(--radius); padding: 8px 10px; display: flex; flex-direction: column; gap: 6px; }
  .import-ask .frow { display: flex; gap: 6px; }
  .import-ask button { flex: 1; font-size: 13.5px; }
  .list { max-height: 360px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
  .global-off .list { opacity: .45; }
</style>
</head>
<body>
<header>
  <div class="brand"><img src="icons/orchid32.png" alt=""><h2>dmena_request</h2></div>
  <div class="head-right">
    <button id="helpBtn" class="help-btn" title="Ayuda: cómo funciona dmena_request">?</button>
    <label class="switch" title="Activar / desactivar todo"><input type="checkbox" id="globalToggle"><span></span></label>
  </div>
</header>
<main>
  <div id="permBanner" class="banner hidden">
    <span>Falta permiso para modificar peticiones.</span>
    <button id="grantBtn" class="primary">Conceder</button>
  </div>
  <div id="pageSummary" class="page-summary"></div>
  <div id="list" class="list"></div>
  <button id="hiddenNote" class="hidden-note hidden" title="Ver las reglas ocultas en el editor"></button>
  <div id="exportAsk" class="import-ask hidden">
    <div id="exportAskText"></div>
    <div class="frow">
      <button id="expWith" class="primary">Sí, incluirlas</button>
      <button id="expWithout">No, solo visibles</button>
      <button id="expCancel">Cancelar</button>
    </div>
  </div>
  <div id="importAsk" class="import-ask hidden">
    <div id="importAskText"></div>
    <div class="frow">
      <button id="impReplace" class="primary">Reemplazar</button>
      <button id="impAppend">Añadir</button>
      <button id="impCancel">Cancelar</button>
    </div>
  </div>
  <div id="status" class="status"></div>
</main>
<footer>
  <div class="frow">
    <button id="newHereBtn">+ Regla para este sitio</button>
    <button id="openEditorBtn" class="primary">Abrir editor</button>
  </div>
  <div class="frow io">
    <button id="exportBtn" title="Descargar todas las reglas en un fichero JSON">⬇ Exportar JSON</button>
    <button id="importBtn" title="Cargar reglas desde un fichero JSON">⬆ Importar JSON</button>
    <input type="file" id="importFile" accept="application/json,.json" class="hidden">
  </div>
</footer>
<script src="rules.js"></script>
<script src="popup.js"></script>
</body>
</html>
